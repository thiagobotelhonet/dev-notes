[package]
name = "dev-notes"
version = "0.1.0"
description = "Dev Notes: local-first Markdown notes for developers"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "dev_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-fs = { version = "=2.6.0", features = ["watch"] }
tauri-plugin-dialog = "=2.8.0"
trash = "=5.2.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
tempfile = "=3.27.0"
